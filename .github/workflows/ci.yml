---
name: CI

# Fast feedback on every push / pull request: syntax check + offline tests.
# No containers, no publishing.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock flake8

      - name: Lint (syntax errors and undefined names only)
        run: |
          flake8 ml tests --select=E9,F63,F7,F82 --show-source

      - name: Flux table present
        run: |
          test -f ml/flux_table.json || echo "::warning::ml/flux_table.json missing: image runs without the flux check"

      - name: Offline tests
        run: |
          python -m unittest -v tests/test_monitor_offline.py
